[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cliquefinder"
version = "0.1.0"
description = "Regulatory clique discovery for ALS transcriptomics using INDRA CoGEx"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# SEC-15: Dependencies use >= (minimum version) rather than pinned versions.
# This is intentional for a library/framework package — pinning exact versions
# would cause conflicts for downstream users who need different versions of
# shared dependencies. For reproducible deployments, use a lockfile (pip freeze
# or pip-compile) in your application environment.
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "networkx>=3.1",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    "mygene>=3.2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "neo4j>=5.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
cogex = [
    # Knowledge-graph/GSEA integration used by the publication workflows.
    # Pin the reference client revision; the live database corpus remains an
    # external input and is covered by the publication provenance disclaimer.
    "indra-cogex[gsea] @ git+https://github.com/gyorilab/indra_cogex.git@6a95f2b18590ec2ef067217fd1f7f82b6e2f64af ; python_version >= '3.11'",
    "flask>=3.0 ; python_version >= '3.11'",
    "gseapy==1.2.1 ; python_version >= '3.11'",
    "pysb>=1.17.0 ; python_version >= '3.11'",
]
belief = [
    # Not published on PyPI. Pin the last upstream revision that provides the
    # noise_model and composed_scorer APIs imported by cliquefinder. The belief
    # stack is supported on Python >=3.11: PySB 1.16 (the last 3.10 release)
    # fails under modern isolated builds, while 1.17 provides a wheel for 3.11+.
    "indra-belief @ git+https://github.com/gyorilab/indra-belief-model.git@476e0c81fb0934640d5aa889edfd2f5070651726 ; python_version >= '3.11'",
    "pysb>=1.17.0 ; python_version >= '3.11'",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
# indra-cogex currently declares INDRA from an unversioned Git URL. Override it
# for uv-managed environments so the lock never follows upstream HEAD.
override-dependencies = [
    "indra @ git+https://github.com/gyorilab/indra.git@4c8c0555e5027ee2242b90795b761a6b7e78176b",
]

[project.scripts]
cliquefinder = "cliquefinder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
